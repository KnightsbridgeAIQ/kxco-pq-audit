name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top level. Without this the workflow inherits the
# repository default, which may be read-write, and every job gets a token
# with more authority than it uses. Jobs that need more raise it themselves.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
